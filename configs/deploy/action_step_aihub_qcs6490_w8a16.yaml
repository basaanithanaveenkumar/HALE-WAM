# Qualcomm QCS6490 / RB3 Gen 2: flow-matching step on the Hexagon NPU, W8A16.
_base_:
  - pkg://hale_core.deploy/configs/qualcomm/aihub_qnn_dlc_w8a16.yaml
  - ./_shared/models/halo_vla_flow_matching.yaml
  - ./_shared/parts/action_step.yaml
name: action_step_aihub_qcs6490_w8a16
pipeline:
  - type: QAIHubCompileStage
    device: "QCS6490 (Proxy)"       # robotics SoC proxy device; list devices with `qai-hub list-devices`
    source: torchscript
    target_runtime: qnn_dlc
    quantize_full_type: w8a16
    compute_unit: npu
    profile: true
    validate_on_device: true
