# ============================================================
# HALE-WAM  —  Phase 2: VLA Mid-Training
# ============================================================
# Domain-specific manipulation data for embodiment adaptation.
# Goal: align pretrained representations to target workspace,
# object distribution, and contact dynamics.
#
# VLA datasets (9 total):
#   droid (76K), airoa-moma (local), eo-data-qa (700K), rh20t (110K),
#   taco-play (3.2K), pusht (300), aloha-sim (1K),
#   (+ EO-Data interleave 1.5M for context grounding)
#
# VLM datasets (5 total, connector pretraining):
#   llava-pretrain-558k, sharegpt4v-pt, blip-laion-cc-sbu-558k,
#   recap-datacomp-1b, allava-vflan
# ============================================================

inherits: base.yaml

# ------------------------------------------------------------------
# Data
# ------------------------------------------------------------------
data:
  source: stage_mid_train
  vla_datasets:
    enabled: true
    dataset_names:
      - eo-data-interleave
      - droid
      - rh20t
      - taco-play
      - pusht
      - aloha-sim
      # local datasets (activated when data_root is set)
      - eo-data-qa
      - airoa-moma
  vlm_datasets:
    enabled: true
    dataset_names:
      - llava-pretrain-558k
      - sharegpt4v-pt
      - blip-laion-cc-sbu-558k
      - recap-datacomp-1b
      - allava-vflan
  streaming: true
  prefetch_workers: 4
  max_samples_per_dataset: 50000
  droid_data_root: null         # set to local DROID path to enable
  airoa_data_root: null         # set to local AIRoA-MoMA path to enable
  img_size: 224
  action_dim: 7

# ------------------------------------------------------------------
# Training
# ------------------------------------------------------------------
train:
  backend: vla
  steps: 50000
  batch_size: 64
  lr: 5.0e-5
  warmup_steps: 1000
  lr_scheduler: cosine
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accum_steps: 1
  dtype: bfloat16
  checkpoint_every_n_steps: 2000
  seed: 1

# ------------------------------------------------------------------
# Model
# ------------------------------------------------------------------
model:
  proj_type: mlp
  use_moe: true
  enable_visual_dit: true       # enable world-model heads during mid-train
  visual_loss_weight: 4.0       # reduced relative to final fine-tuning
  gradient_checkpointing: true

# ------------------------------------------------------------------
# Logging & Eval
# ------------------------------------------------------------------
logging:
  backend: tensorboard
  tensorboard: true
  log_every_n_steps: 100

eval:
  enabled: true
  every_n_steps: 5000
  benchmarks: []                # add e.g. [droid_task] when data_root is set
  max_eval_episodes: 20
