# ============================================================
# HALE-WAM  —  Eval: Meta-World MT50 benchmark
# ============================================================

inherits: base.yaml

data:
  source: stage_post_train
  vla_datasets:
    enabled: true
    dataset_names:
      - metaworld-mt50
  streaming: false
  max_samples_per_dataset: null

train:
  steps: 0

eval:
  enabled: true
  every_n_epochs: 1
  benchmarks:
    - metaworld
  max_eval_episodes: 100
  render_video: true

deploy:
  enabled: true
  device: cpu
  dtype: float32
  action_chunk_size: 16
