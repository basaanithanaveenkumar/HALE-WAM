# ============================================================
# Halo-VLA  -  smoke test: a few samples, small model, no DiT / GIFs, CPU-friendly
#   python scripts/train.py --config configs/overfit.yaml
# ============================================================
inherits: base.yaml
variant: halo_vla_overfit

model:
  emb_dim: 128
  gradient_checkpointing: false
  decoder: {num_layers: 2, num_heads: 4, mlp_dim: 256}
  moe: {enabled: false}
  vision:
    image_size: 112
    vit: {num_layers: 2, num_heads: 4, mlp_dim: 256}
  action:
    flow: {hidden_dim: 256}
  world_model:
    enabled: false                # skip the DiT for a fast overfit

train:
  epochs: 20
  batch_size: 2
  lr: 3.0e-4
  checkpoint: {every_n_steps: 1000, keep_last: 1}

data:
  max_samples: 16
  num_workers: 0

logging:
  tensorboard_dir: ""

viz:
  every_n_steps: 0
