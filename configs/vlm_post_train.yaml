# ============================================================
# HALE-WAM  —  VLM Post-Training (instruction-following SFT)
# ============================================================
# Full SFT on diverse instruction-following benchmarks.
# Enables the model to respond correctly to natural language
# task descriptions before robot policy fine-tuning.
#
# Datasets (7): llava-instruct-665k, textvqa, scienceqa, chartqa,
#               infographics-vqa, seed-bench, llava-plus
# ============================================================

inherits: base.yaml

data:
  source: stage_post_train
  vla_datasets:
    enabled: false
  vlm_datasets:
    enabled: true
    dataset_names:
      - llava-instruct-665k
      - textvqa
      - scienceqa
      - chartqa
      - infographics-vqa
      - seed-bench
      - llava-plus
  streaming: true
  prefetch_workers: 2
  max_samples_per_dataset: 100000

train:
  backend: vlm
  steps: 20000
  batch_size: 64
  lr: 2.0e-5
  warmup_steps: 500
  lr_scheduler: cosine
  weight_decay: 0.01
  grad_clip: 1.0
  dtype: bfloat16
  checkpoint_every_n_steps: 1000

model:
  proj_type: mlp
  enable_visual_dit: false
  gradient_checkpointing: true

logging:
  backend: tensorboard
  tensorboard: true
  log_every_n_steps: 50

eval:
  enabled: true
  every_n_steps: 5000
  benchmarks: []
