[pytest]
# Import roots: repo root (``config``), src (``Halo_VLA.deploy``), src/Halo_VLA (``models``).
pythonpath = . src src/Halo_VLA
testpaths = tests
markers =
    unit: fast, isolated tests (tests/unit): no network, GPU or real checkpoints
    integration: end-to-end flows on real configs (tests/integration): training runs, RL, deploy pipelines
